name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Test API (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest

  docker:
    name: Build immagine Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t neuroparty-api:ci .
      - name: Smoke test del container
        run: |
          docker run -d --name api -p 8000:8000 -e ADMIN_TOKEN=ci -e SEED_DEMO_DATA=true neuroparty-api:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/api/health; then ok=1; break; fi; sleep 1
          done
          [ "$ok" = "1" ] || { docker logs api; exit 1; }
          curl -fsS http://127.0.0.1:8000/api/snapshot | head -c 300; echo
          docker rm -f api
